{% extends 'layout.html' %}
{% load static %}

{% block main-content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="min-height: 70vh;">
    <div class="bg-white p-5 rounded-4 shadow-sm border-0 w-100" style="max-width: 450px;">
        
        <div class="text-center mb-4">
            <h3 class="fw-bolder text-uppercase mb-2" style="letter-spacing: 2px;">Quên Mật Khẩu</h3>
            <p class="text-secondary small">Nhập email của bạn để nhận link đặt lại mật khẩu.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="form-label fw-bold small text-secondary text-uppercase">Email</label>
                <input type="email" name="email" class="form-control bg-light border-0 shadow-none px-4 py-3 rounded-3 {% if form.email.errors %}is-invalid{% endif %}" placeholder="example@gmail.com" required>
                {% for error in form.email.errors %}
                    <div class="text-danger small fw-bold mt-1">⚠ {{ error }}</div>
                {% endfor %}
            </div>

            <div class="mb-4 mt-2">
                <button type="submit" class="btn btn-dark w-100 py-3 rounded-pill fw-bold text-uppercase transition-hover" style="letter-spacing: 1px;">
                    Gửi yêu cầu
                </button>
            </div>
        
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'dangnhap' %}" class="text-dark fw-bold text-decoration-none small">
                Quay lại Đăng nhập
            </a>
        </div>
        
    </div>
</div>

<style>
    .transition-hover {
        transition: all 0.3s ease;
    }
    .transition-hover:hover {
        transform: translateY(-3px);
        opacity: 0.85;
    }
    .form-control:focus {
        background-color: #fff !important;
        border: 1px solid #000 !important;
        box-shadow: none !important;
    }
</style>
{% endblock main-content %}
