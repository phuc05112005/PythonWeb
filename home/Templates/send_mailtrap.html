{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phản Hồi Khách Hàng</title>

    <!-- Bootstrap & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .mail-form {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 25px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
        }

        .mail-form h1 {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            color: #0d1b2a;
            margin-bottom: 30px;
        }

        /* input + textarea mặc định đẹp */
        .mail-form input,
        .mail-form textarea {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            border: 1px solid #ced4da;
            font-size: 16px;
            transition: all 0.3s;
            background: #f7f9fc;
            color: #0d1b2a;
        }

        .mail-form input[type="text"]:focus,
        .mail-form textarea:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 15px rgba(13,110,253,0.3);
            outline: none;
        }

        .mail-form button {
            width: 100%;
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            padding: 15px 0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 8px 20px rgba(13,110,253,0.4);
        }

        .mail-form button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(13,110,253,0.5);
        }

        .message {
            text-align: center;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 16px;
            padding: 10px;
            border-radius: 12px;
        }

        .message.success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .message.error {
            background: #f8d7da;
            color: #842029;
        }
    </style>
</head>
<body>

<div class="mail-form">

    <h1>Phản Hồi Khách Hàng</h1>

    <!-- Messages -->
    {% if messages %}
        {% for message in messages %}
            <div class="message {% if message.tags == 'error' %}error{% else %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- Form -->
    <form method="post">
        {% csrf_token %}

        <input type="text" name="subject" placeholder="Vấn đề bạn gặp phải" required>

        <input type="email" name="email" placeholder="Email để shop phản hồi" required>

        <textarea name="message" rows="4" placeholder="Nhập nội dung..." required></textarea>

        <button type="submit">
            <i class="fa-solid fa-paper-plane"></i> Gửi Phản Hồi
        </button>
    </form>
    <div class="text-center mt-3">
        <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
            <i class="fa-solid fa-house"></i> Quay về trang chủ
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
