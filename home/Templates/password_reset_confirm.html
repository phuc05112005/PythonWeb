{% extends 'layout.html' %}
{% load static %}

{% block main-content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="min-height: 70vh;">
    <div class="bg-white p-5 rounded-4 shadow-sm border-0 w-100" style="max-width: 450px;">
        
        <div class="text-center mb-4">
            <h3 class="fw-bolder text-uppercase mb-2" style="letter-spacing: 2px;">Đặt Lại Mật Khẩu</h3>
            <p class="text-secondary small">Vui lòng nhập mật khẩu mới của bạn.</p>
        </div>

        {% if validlink %}
        <form method="post" class="django-custom-form">
            {% csrf_token %}
            
            {{ form.as_p }}

            <div class="mb-4 mt-4">
                <button type="submit" class="btn btn-dark w-100 py-3 rounded-pill fw-bold text-uppercase transition-hover" style="letter-spacing: 1px;">
                    Lưu mật khẩu mới
                </button>
            </div>
        </form>
        {% else %}
        <div class="alert alert-danger text-center">
            Link này không hợp lệ hoặc đã hết hạn.
        </div>
        <div class="text-center mt-3">
            <a href="{% url 'password_reset' %}" class="btn btn-outline-dark rounded-pill px-4">Yêu cầu link mới</a>
        </div>
        {% endif %}
        
    </div>
</div>

<style>
    .django-custom-form p { margin-bottom: 1.25rem; }
    .django-custom-form label { display: block; font-size: 0.875rem; font-weight: 700; color: #6c757d; text-transform: uppercase; margin-bottom: 0.5rem; }
    .django-custom-form input { width: 100%; padding: 0.75rem 1rem; background-color: #f8f9fa; border: 1px solid transparent; border-radius: 0.5rem; transition: all 0.2s; }
    .django-custom-form input:focus { background-color: #ffffff; border: 1px solid #000; outline: none; box-shadow: none; }
    .django-custom-form .helptext { display: block; font-size: 0.75rem; color: #adb5bd; margin-top: 0.4rem; line-height: 1.4; }
</style>
{% endblock main-content %}
