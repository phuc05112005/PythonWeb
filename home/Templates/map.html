{% extends "layout.html" %}
{% load static %}

{% block main-content %}
<meta name="referrer" content="no-referrer-when-downgrade">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>

.map-wrapper{
display:flex;
height:calc(100vh - 75px);
}

/* SIDEBAR */

.sidebar{
width:360px;
background:#ffffff;
padding:20px;
overflow-y:auto;
border-right:1px solid #e6e9f2;
}

.sidebar h3{
font-size:20px;
font-weight:700;
margin-bottom:15px;
}

/* SEARCH */

.searchBox{
width:100%;
padding:10px 14px;
border-radius:10px;
border:1px solid #dfe3eb;
margin-bottom:12px;
font-size:14px;
}

.searchBox:focus{
outline:none;
border-color:#4a8cff;
box-shadow:0 0 0 3px rgba(74,140,255,0.15);
}

/* BUTTON BASE */

.btn-map{
padding:9px 16px;
border:none;
border-radius:12px;
font-size:13px;
font-weight:600;
cursor:pointer;
margin:4px 3px;
transition:all 0.25s ease;
display:inline-block;
letter-spacing:0.3px;
}

/* NÚT CHÍNH (3km, 5km, Chỉ đường) – TÍM GRADIENT */

.btn-blue{
background:linear-gradient(135deg,#1a56fc,#02a68b);
color:white;
box-shadow:0 6px 14px rgba(0, 152, 147, 0.35);
}

.btn-blue:hover{
transform:translateY(-2px);
box-shadow:0 10px 22px rgba(1, 139, 144, 0.45);
}

.btn-blue:active{
transform:scale(0.95);
}

/* NÚT VỊ TRÍ – CAM GRADIENT */

.btn-green{
background:linear-gradient(135deg,#4382ff,#18dcff);
color:white;
box-shadow:0 6px 14px rgba(3, 18, 186, 0.35);
}

.btn-green:hover{
transform:translateY(-2px);
box-shadow:0 10px 22px rgba(2, 18, 186, 0.45);
}

.btn-green:active{
transform:scale(0.95);
}

/* NÚT RESET – HỒNG NHẠT CHỮ ĐỎ */

.btn-gray{
background:#ffe4ea;
color:#d62839;
border:1px solid #fec4ce;
box-shadow:0 4px 10px rgba(255,120,140,0.25);
}

.btn-gray:hover{
background:#ffd3dc;
transform:translateY(-1px);
box-shadow:0 8px 18px rgba(255,120,140,0.35);
}

.btn-gray:active{
transform:scale(0.95);
}
/* BUTTON ĐANG CHỌN */

.btn-selected{
background:linear-gradient(135deg,#ff6a00,#ff2d55) !important;
box-shadow:0 10px 25px rgba(255,80,100,0.6) !important;
transform:scale(1.05);
}

/* hiệu ứng click nảy nhẹ */
.btn-map.clicked{
animation:clickPop 0.25s ease;
}

@keyframes clickPop{
0%{transform:scale(1);}
50%{transform:scale(0.9);}
100%{transform:scale(1.05);}
}
.btn-nearest{
padding:9px 12px;       /* giảm ngang */
min-width:auto;
width:auto;
white-space:nowrap;     /* không xuống dòng */
}
/* MAP */

#map{
flex:1;
}

/* SHOP LIST */

.shop-box{
background:white;
border:1px solid #e8ecf5;
border-radius:12px;
padding:12px;
margin-bottom:10px;
cursor:pointer;
transition:0.2s;
}

.shop-box:hover{
background:#f4f7ff;
border-color:#cfd8ff;
transform:translateY(-1px);
}

.shop-active{
border:2px solid #4a8cff;
background:#f4f7ff;
}

.shop-name{
font-weight:700;
font-size:15px;
}

.shop-address{
font-size:13px;
color:#6a7385;
}

.shop-distance{
font-size:13px;
color:#4a8cff;
font-weight:600;
}

/* ROUTE BOX */

.routeBox{
position:fixed;
top:90px;
right:20px;
background:white;
padding:15px;
width:260px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
max-height:420px;
overflow:auto;
z-index:1200;
}

.leaflet-popup{
z-index:1000;
}

.routeInfo{
font-weight:700;
margin-bottom:10px;
border-bottom:1px solid #eee;
padding-bottom:8px;
}

.route-step{
font-size:13px;
padding:6px 0;
border-bottom:1px dashed #eee;
}

/* WRAPPER */
.contact-wrapper {
    position: fixed;
    right: 25px;
    bottom: 80px;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 10px;
}

.contact-tooltip {
    position: absolute;
    right: 0;
    bottom: -60px; /* xuống dưới icon khoảng 60px */
    background: #fff;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    color: #333;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    white-space: nowrap;
    font-weight: bold;
}

/* PHONE BUTTON */
.phone-btn {
    background: linear-gradient(135deg, #00c853, #00e676);
    color: #fff;
    padding: 10px 14px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(0,200,83,0.4);
    transition: 0.3s;
}

.phone-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,200,83,0.5);
}

/* ZALO */
.zalo-btn img {
    width: 55px;
    animation: zaloPulse 1.5s infinite;
}

/* ANIMATION */
@keyframes zaloPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}


@keyframes zaloPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}
/* =========================
   SIDEBAR TOGGLE (APP STYLE)
========================= */

/* NÚT MỞ */
.toggle-sidebar{
    position: fixed;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    background: #4a8cff;
    color: white;
    padding: 10px 12px;
    border-radius: 0 10px 10px 0;
    cursor: pointer;
    z-index: 1500;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* ICON XOAY */
.toggle-sidebar i{
    transition: 0.3s;
}

/* =========================
   RESPONSIVE: ẨN SIDEBAR
========================= */
.toggle-sidebar{
    display: none; /* ẨN MẶC ĐỊNH */
}
@media (max-width: 1024px){

    /* HIỆN NÚT KHI MÀN NHỎ */
    .toggle-sidebar{
        display: block;
    }

    .sidebar{
        position: fixed;
        top: 75px;
        left: -360px; /* ẨN */
        height: calc(100vh - 75px);
        z-index: 1400;
        transition: 0.3s;
        box-shadow: 5px 0 20px rgba(0,0,0,0.15);
    }

    .sidebar.active{
        left: 0;
    }

    #map{
        width:100%;
    }

    .toggle-sidebar.active i{
        transform: rotate(180deg);
    }
}
</style>

<div class="map-wrapper">
<div id="toggleSidebar" class="toggle-sidebar">
    <i class="fa-solid fa-chevron-right"></i>
</div>
<div class="sidebar">

<h3>Hệ thống cửa hàng</h3>

<input id="searchInput" class="searchBox" placeholder="Tìm cửa hàng...">

<button class="btn-map btn-green" onclick="getUserLocation()">Vị trí của tôi</button>
<button class="btn-map btn-gray" onclick="resetMap()">Reset</button>

<br>

<button id="btn3km" class="btn-map btn-blue" onclick="selectButton(this); filterRadius(3)">3 km</button>
<button id="btn5km" class="btn-map btn-blue" onclick="selectButton(this); filterRadius(5)">5 km</button>
<button id="btnNearest" 
class="btn-map btn-blue btn-nearest" 
onclick="selectButton(this); nearestStore()">
Cửa hàng gần nhất
</button>

<hr>

<select id="districtFilter" class="searchBox" onchange="filterByDistrict()">
    <option value="">-- Lọc theo khu vực (phường) --</option>
</select>
<label style="display:flex;align-items:center;margin:10px 0;font-size:14px;cursor:pointer">
    <input type="checkbox" id="openFilter" onchange="toggleOpenFilter()" style="margin-right:8px">
    Danh sách cửa hàng đang mở cửa
</label>

<div id="shopList"></div>

</div>

<div id="map"></div>

</div>

<div id="routeBox" class="routeBox" style="display:none">

<div id="routeInfo" class="routeInfo"></div>

<div id="routeSteps"></div>
</div>
<div class="contact-wrapper">

    <!-- BOX TEXT -->
    <div class="contact-tooltip">
        Liên hệ Zalo & Hotline của shop để được tư vấn và hỗ trợ
    </div>

    <!-- PHONE -->
    <a href="tel:0908178656" class="phone-btn">
        <i class="fa-solid fa-phone"></i>
        028 797 97979
    </a>

    <!-- ZALO -->
    <a href="https://zalo.me/0908178656" target="_blank" class="zalo-btn">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg">
    </a>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map=L.map('map').setView([10.8,106.7],12)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map)


/* DATA */

var stores=JSON.parse('{{ stores_json|escapejs }}')

var markers=[]
var userLat=null
var userLon=null
var userMarker=null
var routeLayer=null
var radiusCircle=null
var showOpenOnly = false
var currentDistrict = ""

/* ICON */

var storeIcon=L.icon({
iconUrl:'{% static "icons/store.png" %}',
iconSize:[28,28],
iconAnchor:[14,28]
})

var userIcon=L.icon({
iconUrl:'{% static "icons/user.png" %}',
iconSize:[28,28],
iconAnchor:[14,28]
})

/* LOAD MARKERS */

function loadMarkers(){

markers=[]

stores.forEach(function(store){

var marker=L.marker([store.lat,store.lon],{icon:storeIcon}).addTo(map)

var popup=`
<div style="width:230px">

<img src="${store.hinh}" 
     style="width:100%;height:130px;object-fit:cover;border-radius:10px;margin-bottom:8px"
     onerror="this.src='/static/images/cuahang1.jpg'">

<div style="font-weight:700;font-size:15px">
${store.ten}
</div>

<div style="font-size:13px;color:#666;margin-bottom:6px">
${store.diachi}
</div>

<div style="font-size:13px;color:#666;margin-bottom:6px">
📞 ${store.sodienthoai ? store.sodienthoai : 'Chưa cập nhật'}
</div>

<div style="font-size:13px;margin-bottom:6px">
🕒 ${store.gio_mo} - ${store.gio_dong}
</div>

<div style="margin-bottom:10px;font-weight:600;
color:${store.is_open ? 'green' : 'red'}">
${store.is_open ? '🟢 Đang mở cửa' : '🔴 Đang đóng cửa'}
</div>

<button onclick="routeToStore(${store.lat},${store.lon})" 
class="btn-map btn-blue" style="width:100%">
Chỉ đường
</button>

</div>
`

marker.bindPopup(popup)
marker.on('click', function(){

    // Xóa active cũ
    document.querySelectorAll('.shop-box').forEach(box=>{
        box.classList.remove('shop-active')
    })

    // Tìm đúng item trong list
    let el = document.getElementById(`shop-${store.lat}-${store.lon}`)

    if(el){
        el.classList.add('shop-active')

        // Scroll tới luôn (rất xịn)
        el.scrollIntoView({
            behavior: 'smooth',
            block: 'center'
        })
    }

})
markers.push({
marker:marker,
data:store
})

})

}

loadMarkers()
function loadDistricts(){

    var districts = new Set()

    stores.forEach(s=>{
        if(s.diachi){
            let parts = s.diachi.split(",")
            let district = parts[parts.length-2]?.trim()
            if(district) districts.add(district)
        }
    })

    var select = document.getElementById("districtFilter")

    districts.forEach(d=>{
        let opt = document.createElement("option")
        opt.value = d
        opt.textContent = d
        select.appendChild(opt)
    })
}


loadDistricts()
function filterByDistrict(){

    currentDistrict = document.getElementById("districtFilter").value

    applyFilters()
}
function toggleOpenFilter(){
    showOpenOnly = document.getElementById("openFilter").checked
    applyFilters()
}

/* SHOP LIST */

function renderShopList(list){

var html=""

list.forEach(function(s){

let distanceText="Chưa xác định"

if(userLat){
let d=map.distance([userLat,userLon],[s.lat,s.lon])/1000
distanceText=d.toFixed(2)+" km"
}

html+=`

<div class="shop-box"
id="shop-${s.lat}-${s.lon}"
onclick="focusShop(${s.lat},${s.lon}); setActiveShop(this)">

<div class="shop-name">${s.ten}</div>

<div class="shop-address">${s.diachi}</div>

<div class="shop-distance">Khoảng cách: ${distanceText}</div>

<br>

<button class="btn-map btn-blue"
onclick="routeToStore(${s.lat},${s.lon});event.stopPropagation()">
Chỉ đường
</button>

</div>

`

})

document.getElementById("shopList").innerHTML=html


}

renderShopList(stores)
function applyFilters(){

    var result = stores.filter(s=>{

        // filter mở cửa
        if(showOpenOnly && !s.is_open) return false

        // filter quận
        if(currentDistrict){
            if(!s.diachi || !s.diachi.includes(currentDistrict)) return false
        }

        return true
    })

    // update marker
    markers.forEach(m=>{
        if(result.includes(m.data)){
            m.marker.addTo(map)
        }else{
            map.removeLayer(m.marker)
        }
    })

    renderShopList(result)
}
/* SEARCH */

document.getElementById("searchInput").addEventListener("input",function(){

var key=this.value.toLowerCase()

var result=stores.filter(s=>s.ten.toLowerCase().includes(key))

renderShopList(result)

})

/* FOCUS */

function focusShop(lat, lon){

    map.setView([lat, lon], 16)

    // Tìm marker tương ứng
    markers.forEach(function(m){

        if(m.data.lat === lat && m.data.lon === lon){

            // Mở popup luôn
            m.marker.openPopup()

        }

    })

}

/* USER LOCATION */

function getUserLocation(){

navigator.geolocation.getCurrentPosition(function(pos){

userLat=pos.coords.latitude
userLon=pos.coords.longitude

if(userMarker){
map.removeLayer(userMarker)
}

userMarker=L.marker([userLat,userLon],{icon:userIcon}).addTo(map)
.bindPopup("Vị trí của bạn",{offset:[0,-20]}).openPopup()

map.setView([userLat,userLon],14)

renderShopList(stores)

})

}

/* FILTER */

function filterRadius(km){

if(!userLat){
alert("Bấm 'Vị trí của tôi'")
return 
}

if(radiusCircle){
map.removeLayer(radiusCircle)
}

radiusCircle=L.circle([userLat,userLon],{
radius:km*1000,
color:"#4a8cff",
fillOpacity:0.1
}).addTo(map)

var result=[]

markers.forEach(function(m){

let d=map.distance([userLat,userLon],[m.data.lat,m.data.lon])/1000

if(d<=km){
m.marker.addTo(map)
result.push(m.data)
}else{
map.removeLayer(m.marker)
}

})

renderShopList(result)

}

/* NEAREST */

function nearestStore(){

if(!userLat){
alert("Bấm 'Vị trí của tôi'")
return
}

var nearest=null
var min=999999

stores.forEach(function(s){

let d=map.distance([userLat,userLon],[s.lat,s.lon])

if(d<min){
min=d
nearest=s
}

})

/* CHỈ HIỆN 1 CỬA HÀNG TRONG SIDEBAR */
renderShopList([nearest])

/* ẨN CÁC MARKER KHÁC */
markers.forEach(function(m){

if(m.data.lat === nearest.lat && m.data.lon === nearest.lon){
m.marker.addTo(map)
}else{
map.removeLayer(m.marker)
}

})

/* ZOOM VÀ CHỈ ĐƯỜNG */
map.setView([nearest.lat, nearest.lon],16)
routeToStore(nearest.lat,nearest.lon)

}

/* RESET */

function resetMap(){

if(routeLayer){
map.removeLayer(routeLayer)
}

if(radiusCircle){
map.removeLayer(radiusCircle)
}

document.getElementById("routeBox").style.display="none"

showOpenOnly = false
currentDistrict = ""

document.getElementById("districtFilter").value = ""
document.getElementById("openFilter").checked = false

markers.forEach(m=>m.marker.addTo(map))

renderShopList(stores)
document.querySelectorAll('#btn3km, #btn5km, #btnNearest').forEach(b=>{
    b.classList.remove('btn-selected')
})

document.querySelectorAll('.shop-box').forEach(box=>{
    box.classList.remove('shop-active')
})
}

/* ROUTE */

function routeToStore(lat,lon){

if(!userLat){
alert("Bấm 'Vị trí của tôi'")
return
}

if(routeLayer){
map.removeLayer(routeLayer)
}

var url=`https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${lon},${lat}?overview=full&geometries=geojson&steps=true`

fetch(url)
.then(res=>res.json())
.then(data=>{

var route=data.routes[0]

routeLayer=L.geoJSON(route.geometry,{
style:{color:"#ff3b3b",weight:7}
}).addTo(map)

var km=(route.distance/1000).toFixed(2)
var time=Math.round(route.duration/60)

document.getElementById("routeInfo").innerHTML=
`Quãng đường: ${km} km<br>Thời gian: ~${time} phút (Tùy vào mật độ giao thông)`

showSteps(route.legs[0].steps)

})

}
function setActiveShop(el){

    document.querySelectorAll('.shop-box').forEach(box=>{
        box.classList.remove('shop-active')
    })

    el.classList.add('shop-active')

}

/* STEPS */

function showSteps(steps){

var html=""

steps.forEach(function(s){

var dist=Math.round(s.distance)

var action="Đi thẳng"

if(s.maneuver.modifier=="left") action="Rẽ trái"
if(s.maneuver.modifier=="right") action="Rẽ phải"

var road=s.name?s.name:"đường phía trước"

html+=`<div class="route-step">
<b>${dist}m</b> ${action} vào <b>${road}</b>
</div>`

})

document.getElementById("routeSteps").innerHTML=html
document.getElementById("routeBox").style.display="block"

}
function selectButton(btn){

// Xóa trạng thái tất cả nút
document.querySelectorAll('#btn3km, #btn5km, #btnNearest').forEach(b=>{
    b.classList.remove('btn-selected')
})

// Thêm trạng thái cho nút được chọn
btn.classList.add('btn-selected')

// Hiệu ứng click nảy
btn.classList.add('clicked')
setTimeout(()=>{
    btn.classList.remove('clicked')
},250)

}
const toggleBtn = document.getElementById("toggleSidebar");
const sidebar = document.querySelector(".sidebar");

toggleBtn.addEventListener("click", () => {
    sidebar.classList.toggle("active");
    toggleBtn.classList.toggle("active");

    // Fix map resize khi mở sidebar
    setTimeout(() => {
        map.invalidateSize();
    }, 300);
});
map.on("click", function(){
    if(window.innerWidth <= 1024){
        sidebar.classList.remove("active");
        toggleBtn.classList.remove("active");
    }
});
</script>
{% block footer %}{% endblock %}

{% endblock %}
