{% extends 'layout.html' %}
{% load static %}

{% block main-content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="min-height: 70vh;">
    <div class="bg-white p-5 rounded-4 shadow-sm border-0 w-100 text-center" style="max-width: 450px;">
        
        <div class="mb-4">
            <div class="display-1 text-success mb-3">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <h3 class="fw-bolder text-uppercase mb-2" style="letter-spacing: 2px;">Thành Công!</h3>
            <p class="text-secondary small">Mật khẩu của bạn đã được thay đổi thành công. Bây giờ bạn có thể đăng nhập bằng mật khẩu mới.</p>
        </div>

        <div class="mt-4">
            <a href="{% url 'dangnhap' %}" class="btn btn-dark w-100 py-3 rounded-pill fw-bold text-uppercase transition-hover">
                Đăng nhập ngay
            </a>
        </div>
        
    </div>
</div>
{% endblock main-content %}
