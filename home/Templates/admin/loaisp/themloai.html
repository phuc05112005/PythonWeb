{% extends 'layoutadmin.html' %}
{% load static %}

{% block main-content %}
<div class="container-fluid mt-5 mb-5 px-4">
    
    <div class="d-flex justify-content-between align-items-end mb-4 mx-auto" style="max-width: 600px;">
        <div>
            <h2 class="fw-bold text-uppercase m-0">Thêm Loại Sản Phẩm</h2>
            <div style="width: 40px; height: 3px; background: #000; margin-top: 10px;"></div>
        </div>
        <a href="{% url 'quanlyloai' %}" class="text-decoration-none text-dark fw-bold small text-uppercase">
            Quay về
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-0 mx-auto" style="max-width: 600px;">
        <div class="card-body p-4 p-md-5">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-5">
                    <label class="form-label fw-bold small text-uppercase text-secondary">Tên loại sản phẩm</label>
                    <input type="text" name="loai" 
                           class="form-control rounded-0 border-0 bg-light px-3 py-3 shadow-none">
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-dark rounded-0 py-3 fw-bold text-uppercase" style="letter-spacing: 2px;">
                        Xác nhận thêm mới
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>

<style>
    .form-control:focus {
        background-color: #e9ecef !important;
        border: none !important;
        box-shadow: none !important;
    }
    .btn-dark {
        transition: background-color 0.3s ease;
    }
    .btn-dark:hover {
        background-color: #1a1a1a;
    }
</style>
{% endblock main-content %}
