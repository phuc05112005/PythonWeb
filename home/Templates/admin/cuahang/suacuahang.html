{% extends 'layoutadmin.html' %}
{% load static %}

{% block main-content %}
<meta name="referrer" content="no-referrer-when-downgrade">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div class="container-fluid mt-5 mb-5 px-4">
    <div class="d-flex justify-content-between align-items-end mb-4 mx-auto" style="max-width: 900px;">
        <div>
            <h2 class="fw-bold text-uppercase m-0">Sửa Cửa Hàng</h2>
            <p class="text-muted small m-0 mt-1">ID: #{{ cuahang.id }}</p>
            <div style="width: 40px; height: 3px; background: #000; margin-top: 10px;"></div>
        </div>
        <a href="{% url 'quanlycuahang' %}" class="text-decoration-none text-dark fw-bold small text-uppercase">
            Hủy thay đổi
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-0 mx-auto" style="max-width: 900px;">
        <div class="card-body p-4 p-md-5">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase text-secondary">Tên cửa hàng</label>
                    <input type="text" name="ten" value="{{ cuahang.ten|default:'' }}"
                           class="form-control rounded-0 border-0 bg-light px-3 py-3 shadow-none" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase text-secondary">Số điện thoại cửa hàng</label>
                    <input type="text" name="sodienthoai" value="{{ cuahang.sodienthoai|default:'' }}"
                           class="form-control rounded-0 border-0 bg-light px-3 py-3 shadow-none"
                           >
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-uppercase text-secondary">Hình hiện tại</label>
                    {% if cuahang.hinh %}
                        <img src="{{ cuahang.hinh.url }}" alt="Hình cửa hàng" style="width: 200px; height: auto; display: block; margin-bottom: 10px;">
                    {% else %}
                        <p class="text-muted small">Chưa có hình</p>
                    {% endif %}
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase text-secondary">Thay hình mới</label>
                    <input type="file" name="hinh" class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase text-secondary">Giờ mở</label>
                    <input type="time" name="gio_mo" value="{{ cuahang.gio_mo }}" class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase text-secondary">Giờ đóng</label>
                    <input type="time" name="gio_dong" value="{{ cuahang.gio_dong }}" class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold small text-uppercase text-secondary">Địa chỉ</label>
                    <div class="input-group">
                        <textarea name="diachi" id="diachi"
                                  class="form-control rounded-0 border-0 bg-light px-3 py-3 shadow-none"
                                  style="height: 80px;">{{ cuahang.diachi|default:'' }}</textarea>
                        <button type="button" class="btn btn-dark rounded-0 px-4 fw-bold small text-uppercase" onclick="searchAddress()">
                            Tìm vị trí
                        </button>
                    </div>
                </div>

                <input type="hidden" name="lat" id="lat" value="{{ cuahang.lat|default:'' }}">
                <input type="hidden" name="lon" id="lon" value="{{ cuahang.lon|default:'' }}">

                <div class="mb-5">
                    <label class="form-label fw-bold small text-uppercase text-secondary d-block mb-3">Vị trí hiện tại trên bản đồ</label>
                    <div id="map" style="height: 400px; width: 100%; border: 1px solid #eee;"></div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-dark rounded-0 py-3 fw-bold text-uppercase" style="letter-spacing: 2px;">
                        Lưu thay đổi
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    var initialLat = "{{ cuahang.lat }}".replace(',', '.');
    var initialLon = "{{ cuahang.lon }}".replace(',', '.');
    var lat = initialLat ? parseFloat(initialLat) : 10.762622;
    var lon = initialLon ? parseFloat(initialLon) : 106.660172;

    var map = L.map('map').setView([lat, lon], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var marker;
    if (initialLat && initialLon) {
        marker = L.marker([lat, lon], { draggable: true }).addTo(map);
    }

    function searchAddress() {
        var address = document.getElementById('diachi').value;
        if (!address) return alert("Vui lòng nhập địa chỉ!");

        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address + ", Vietnam")}`)
            .then(res => res.json())
            .then(data => {
                if (data.length > 0) {
                    updateMap(data[0].lat, data[0].lon);
                } else {
                    alert("Không tìm thấy tọa độ cho địa chỉ này!");
                }
            });
    }

    function updateMap(lat, lon) {
        document.getElementById('lat').value = lat;
        document.getElementById('lon').value = lon;
        map.setView([lat, lon], 16);
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lon], { draggable: true }).addTo(map);
        marker.on('dragend', function () {
            var newPos = marker.getLatLng();
            document.getElementById('lat').value = newPos.lat;
            document.getElementById('lon').value = newPos.lng;
        });
    }

    map.on('click', function (e) {
        updateMap(e.latlng.lat, e.latlng.lng);
    });
</script>

<style>
    .card, .form-control, .btn, #map {
        border-radius: 0 !important;
    }
    .form-control:focus {
        background-color: #e9ecef !important;
        border: none !important;
        box-shadow: none !important;
    }
</style>
{% endblock main-content %}
